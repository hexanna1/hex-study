<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hex Board</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page study-page-wide board-editor-page hex-page">
      <header class="hero">
        <a class="site-mark" href="./index.html">Hex Study</a>
        <span class="header-sep" aria-hidden="true">/</span>
        <h1>Hex Board</h1>
      </header>

      <section class="layout study-layout-wide">
        <section class="board-panel">
          <div class="board-topbar">
            <p id="hex-status" class="turn-indicator">Turn: Red</p>
            <div class="board-topbar-controls">
              <div class="board-size-control">
                <div id="size-stepper" class="board-size-stepper" role="group" aria-label="Board size">
                  <button id="size-prev-btn" class="study-nav-btn" type="button" aria-label="Smaller board">−</button>
                  <input id="size-input" class="board-size-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="14" aria-label="Board size">
                  <button id="size-next-btn" class="study-nav-btn" type="button" aria-label="Larger board">+</button>
                </div>
              </div>
              <div class="board-controls">
                <button id="reset-btn" class="board-reset" type="button">Reset</button>
              </div>
            </div>
          </div>
          <div class="board-analysis-stage">
            <svg id="board" class="board study-board-wide hex-board" aria-label="Hex board editor"></svg>
            <div class="board-analysis-readout">
              <div class="analysis-metrics">
                <p id="analysis-summary" aria-live="off" hidden>0 visits · – visits/s</p>
                <p id="analysis-runtime" hidden></p>
                <p id="analysis-status" role="status"></p>
              </div>
            </div>
          </div>
          <div class="analysis-toolbar">
            <div class="analysis-run-controls">
              <select id="analysis-model" class="analysis-model-choice" aria-label="Model" data-board-shortcuts>
                <option value="b5nbt-14">b5nbt-14</option>
                <option value="katahex-20240812">katahex</option>
              </select>
              <button id="analysis-toggle" class="text-control" type="button" aria-pressed="false" aria-keyshortcuts="Space" disabled>Start</button>
            </div>
            <div id="analysis-settings" class="analysis-settings">
              <div class="analysis-noise-controls" role="group" aria-label="AnalysisWideRootNoise">
                <button id="analysis-noise-down" class="text-control analysis-noise-step" type="button" aria-label="Decrease AWRN" disabled>−</button>
                <span id="analysis-noise" title="AnalysisWideRootNoise">AWRN 0.04</span>
                <button id="analysis-noise-up" class="text-control analysis-noise-step" type="button" aria-label="Increase AWRN" disabled>+</button>
              </div>
              <button id="analysis-priors" class="text-control" type="button" aria-pressed="false" disabled>Priors</button>
              <button id="analysis-batch" class="text-control" type="button" aria-label="Batch analysis of current sequence of moves" aria-keyshortcuts="Shift+B" disabled>Batch</button>
              <button id="analysis-clear-cache" class="text-control" type="button" aria-label="Clear analysis cache" disabled>Clear</button>
            </div>
          </div>
        </section>

        <section class="detail-panel study-detail-panel-wide">
          <div class="detail-section">
            <div class="detail-inline-row canonical-row">
              <h2>Line</h2>
              <div class="line-load-row">
                <div class="line-copy-field">
                  <input id="current-line" class="line-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="none" value="14," aria-label="Line">
                  <button id="line-copy-btn" class="line-copy-btn" type="button" aria-label="Copy line" data-copy-label="Copy">
                    <svg class="copy-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                      <g class="copy-mark">
                        <rect x="7" y="7" width="10" height="10" rx="1"/>
                        <path d="M13 7V3H3v10h4"/>
                      </g>
                      <path class="copy-success" d="M4 10l4 4 8-9"/>
                      <path class="copy-failure" d="M10 4v8m0 3v.5"/>
                    </svg>
                  </button>
                </div>
                <button id="line-load-btn" class="line-load-btn" type="button">Paste</button>
              </div>
              <span id="copy-status" class="visually-hidden" role="status"></span>
            </div>
            <div class="move-list-nav-stack">
              <div id="move-list" class="move-list" aria-label="Move list"></div>
              <div id="move-nav" class="study-nav" role="group" aria-label="Move navigation">
                <div class="study-nav-group">
                  <button id="move-first-btn" class="study-nav-btn" type="button" aria-label="Start">|&lt;</button>
                  <button id="move-prev-btn" class="study-nav-btn" type="button" aria-label="Previous move">&lt;</button>
                  <button id="move-next-btn" class="study-nav-btn" type="button" aria-label="Next move">&gt;</button>
                  <button id="move-last-btn" class="study-nav-btn" type="button" aria-label="End">&gt;|</button>
                </div>
                <div class="study-nav-group study-nav-secondary-group">
                  <button id="move-pass-btn" class="study-nav-btn move-pass-btn" type="button" tabindex="-1">Pass</button>
                  <button id="move-undo-btn" class="study-nav-btn" type="button" aria-label="Undo edit" title="Undo edit">↶</button>
                  <button id="move-redo-btn" class="study-nav-btn" type="button" aria-label="Redo edit" title="Redo edit">↷</button>
                  <button id="move-delete-btn" class="study-nav-btn" type="button" aria-label="Delete tail" title="Delete tail">×</button>
                </div>
              </div>
            </div>
            <div class="board-display-controls" role="group" aria-label="Board display">
              <button id="move-numbers-btn" class="text-control" type="button" aria-pressed="false" aria-label="Moves: show move numbers" aria-keyshortcuts="M">Moves</button>
              <button id="orientation-diamond-btn" class="text-control" type="button" aria-pressed="false" aria-label="Diamond orientation" aria-keyshortcuts="Shift+O">Diamond</button>
            </div>
            <div id="analysis-graph-wrap" class="analysis-graph-wrap">
              <svg id="analysis-graph" class="analysis-eval-graph" tabindex="0" role="group" aria-label="Red win probability by move. Click to navigate; arrow keys move backward or forward."></svg>
              <div id="analysis-graph-card" class="board-graph-card" hidden></div>
            </div>
            <p id="export-svg-link" class="meta-copy"><a href="#">Download SVG</a></p>
            <p id="shortcut-hint" class="meta-copy shortcut-hint">Shortcuts: <kbd>p</kbd> previous, <kbd>n</kbd> next, <kbd>f</kbd> first, <kbd>l</kbd> last, <kbd>s</kbd> swap, <kbd>?</kbd> <button id="shortcut-help-link" class="shortcut-help-link" type="button" popovertarget="shortcut-help-popover" popovertargetaction="toggle" aria-controls="shortcut-help-popover" aria-expanded="false">help</button>.</p>
            <div id="shortcut-help-popover" class="shortcut-help-popover" popover></div>
            <p id="line-status" class="meta-copy"></p>
          </div>
        </section>
      </section>

      <footer class="page-footer">
        <a href="./index.html">Home</a>
        <span class="footer-sep">·</span>
        <a href="https://github.com/hexanna1">GitHub</a>
        <span class="footer-sep">·</span>
        <a href="https://www.hexwiki.net/index.php/User:Hexanna">HexWiki</a>
      </footer>

      <script src="./position.js"></script>
      <script src="./study_ui.js"></script>
      <script src="./move_tree.js"></script>
      <script src="./board_editor.js"></script>
      <script src="./board_graph_preview.js"></script>
      <script src="./board_eval_graph.js"></script>
      <script src="./board_analysis.js"></script>
      <script src="./hex.js"></script>
    </main>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e1156a581aca4e9bb358a3655fc3714b"}'></script>
  </body>
</html>
